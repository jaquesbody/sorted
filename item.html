<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3d8bfd">
<title>Sorted: Add / Edit</title>
<link rel="stylesheet" href="static/css/main.css">
<link rel="stylesheet" href="static/css/sorted.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="static/icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
</head>
<body>

<main class="dashboard">

  <div class="flex items-center justify-between mb-2">
    <a class="icon-btn icon-btn--back" id="back-link" href="index.html" aria-label="Cancel">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <h1 class="dashboard-header" style="margin-bottom:0;" id="form-title">Add</h1>
    <span style="width:32px;"></span>
  </div>

  <form id="item-form">

    <div class="form-group" data-field="photo-capture-link" style="display:none;">
      <div class="flex items-center justify-center gap-2">
        <button type="button" id="camera-btn" class="icon-btn" aria-label="Take a photo" style="width:36px;height:36px;border:1px solid var(--accent);color:var(--accent);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        </button>
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">
        <button type="button" id="import-btn" class="icon-btn" aria-label="Import captured file" style="width:36px;height:36px;border:1px solid var(--accent);color:var(--accent);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </button>
        <input type="file" id="import-input" accept=".json,image/*" multiple style="display:none;">
      </div>
      <p id="ocr-status" class="text-xs text-secondary" style="text-align:center;margin-top:6px;"></p>
    </div>

    <div class="form-group">
      <label class="form-label" for="title">Title</label>
      <input class="form-input" type="text" id="title" required>
    </div>

    <!-- Spend / Due share: date, amount, category, recurring -->
    <div class="form-group" data-field="date-spend">
      <label class="form-label" for="date">Date</label>
      <input class="form-input" type="date" id="date">
    </div>

    <div class="form-group" data-field="date-due">
      <label class="form-label" for="dueDate">Due date</label>
      <input class="form-input" type="date" id="dueDate">
    </div>

    <div class="form-group" data-field="amount">
      <label class="form-label" for="amount">Amount (£)</label>
      <input class="form-input" type="number" step="0.01" min="0" id="amount">
    </div>

    <div class="form-group" data-field="category">
      <label class="form-label" for="category">Category</label>
      <select class="form-select" id="category"></select>
    </div>

    <div class="form-group" data-field="recurring">
      <div class="form-checkbox-row">
        <input type="checkbox" id="recurring">
        <label class="form-label" for="recurring">Recurring</label>
      </div>
    </div>

    <div class="form-group" data-field="frequency" style="display:none;">
      <label class="form-label" for="frequency">Frequency</label>
      <select class="form-select" id="frequency">
        <option value="weekly">Weekly</option>
        <option value="monthly" selected>Monthly</option>
        <option value="yearly">Yearly</option>
      </select>
    </div>

    <div class="form-group" data-field="confirmed">
      <div class="form-checkbox-row">
        <input type="checkbox" id="confirmed">
        <label class="form-label" for="confirmed">Confirmed (amount verified)</label>
      </div>
    </div>

    <!-- Savings only: current, target -->
    <div class="form-group" data-field="current">
      <label class="form-label" for="current">Current amount (£)</label>
      <input class="form-input" type="number" step="0.01" min="0" id="current">
    </div>

    <div class="form-group" data-field="target">
      <label class="form-label" for="target">Target (£)</label>
      <input class="form-input" type="number" step="0.01" min="0" id="target">
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-accent">Save</button>
      <button type="button" class="btn-danger" id="delete-btn" style="display:none;">Delete</button>
    </div>

  </form>

</main>

<script src="static/vendor/tesseract/tesseract.min.js"></script>
<script src="static/js/db.js"></script>
<script src="static/js/utils.js"></script>
<script src="static/js/categories.js"></script>
<script src="static/js/ocr.js"></script>
<script src="static/js/item-form.js"></script>

<script src="static/js/sw-register.js"></script>
</body>
</html>
