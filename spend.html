<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3d8bfd">
<title>Sorted — Spend</title>
<link rel="stylesheet" href="static/css/main.css">
<link rel="stylesheet" href="static/css/sorted.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="static/icons/favicon-32.png">
<link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
</head>
<body>

<main class="dashboard">

  <div class="flex items-center justify-between mb-1">
    <a class="icon-btn icon-btn--back" href="index.html" aria-label="Back to dashboard">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <h1 class="dashboard-header" style="margin-bottom:0;">Spend</h1>
    <button class="btn-accent btn-accent--square" id="add-item" aria-label="Add item">+</button>
  </div>

  <div class="metric-line mb-2">
    <span class="metric-value" style="font-size:var(--text-base);" id="spend-total">£0.00</span>
    <span class="metric-label">this month</span>
    <span class="metric-label">·</span>
    <span class="metric-value" style="font-size:var(--text-base);" id="spend-annual">£0.00</span>
    <span class="metric-label">this year</span>
  </div>

  <div class="month-nav mb-2">
    <button type="button" class="icon-btn icon-btn--nav" id="prev-month-btn" aria-label="Previous month">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <span id="month-label" class="month-nav-label"></span>
    <button type="button" class="icon-btn icon-btn--nav" id="next-month-btn" aria-label="Next month">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </div>

  <div class="item-list" id="spend-list">
    <!-- Rendered by spend.js from IndexedDB -->
  </div>

</main>

<script src="static/js/db.js"></script>
<script src="static/js/utils.js"></script>
<script src="static/js/spend.js"></script>

<script src="static/js/sw-register.js"></script>
</body>
</html>
