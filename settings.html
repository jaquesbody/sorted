<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3d8bfd">
<title>Sorted: Settings</title>
<link rel="stylesheet" href="static/css/main.css">
<link rel="stylesheet" href="static/css/sorted.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="static/icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
</head>
<body>

<main class="dashboard">

  <div class="flex items-center justify-between mb-2">
    <a class="icon-btn icon-btn--back" href="index.html" aria-label="Back to dashboard">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <h1 class="dashboard-header" style="margin-bottom:0;">Settings</h1>
    <span style="width:32px;"></span>
  </div>

  <div class="form-group">
    <div class="form-checkbox-row">
      <input type="checkbox" id="notif-enabled">
      <label class="form-label" for="notif-enabled">Daily spend reminder + due-date warnings</label>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label" for="reminder-time">Reminder time</label>
    <input class="form-input" type="time" id="reminder-time">
  </div>

  <p class="text-xs text-secondary" id="permission-status" style="margin-bottom:16px;"></p>

  <button type="button" class="btn-accent" id="save-settings-btn">Save</button>

</main>

<script src="static/js/db.js"></script>
<script src="static/js/settings.js"></script>
<script src="static/js/sw-register.js"></script>

</body>
</html>
