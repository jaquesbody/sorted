apply plugin: 'com.android.application'

// The signing key is committed, deliberately, and pinned here rather than left
// to the Android Gradle Plugin's default.
//
// That default resolves to $ANDROID_SDK_HOME, then ~/.android, and whichever
// one your environment happens to point at. It was quietly using
// ~/.config/.android/debug.keystore on this machine, while a *different*
// debug.keystore sat in ~/.android — two plausible keys, and no way to tell
// from the repo which one signed the app. The proof is apksigner: the APKs in
// this repo are signed F8:35:75:56:86:B8:21:74, and only one of those two
// keystores produces that.
//
// It matters more than it looks. Android refuses to install an update signed
// with a different key, so a keystore that quietly changes doesn't lose your
// data — it ends your ability to update, with the only remedy being an
// uninstall, which does lose your data. A debug key signs nothing anyone cares
// about, and committing it is what makes this repo buildable into an
// installable update from any machine.
//
// After changing anything here, check the two digests still agree:
//   apksigner verify --print-certs sorted-v2-<ver>-debug.apk
//   keytool -list -v -keystore android/debug.keystore -storepass android

android {
    namespace = "com.jaquesbody.sorted"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    defaultConfig {
        applicationId "com.jaquesbody.sorted"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 16
        versionName "2.5.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // The pinned key above, not whatever the environment would pick.
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Deliberately unsigned. A release build would need a real key,
            // which is a genuine security boundary rather than a debug key —
            // and the app is sideloaded, so it doesn't need one yet. Don't
            // point this at the debug keystore: that would make the debug build
            // and a "release" interchangeable in a way nobody could tell apart.
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
