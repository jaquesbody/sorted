<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Sorted — track your spending, savings and bills locally. No accounts, no cloud, nothing leaves your device.">
<title>Sorted</title>
<link rel="icon" type="image/png" href="static/icons/favicon-32.png">
<link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
<link rel="stylesheet" href="static/css/main.css">
<script>
// Apply the saved theme before first paint — a light-theme user must not see
// a dark flash while app.js boots. Kept inline and tiny for that reason.
try {
  var t = localStorage.getItem('sorted-theme');
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
} catch (e) { /* private mode / storage disabled — dark is the default */ }

// The phone layout before first paint, for the same reason. The class was being
// added by app.js, which loads after the stylesheet has already painted, so the
// side rail — the widest thing on screen — appeared for a frame and vanished.
// On a phone that reads as the desktop app failing to start. ?native here is
// also what the desktop preview link uses.
try {
  var cap = window.Capacitor;
  var native = !!(cap && cap.isNativePlatform && cap.isNativePlatform())
    || new URLSearchParams(location.search).has('native');
  if (native) document.documentElement.classList.add('is-native');
} catch (e) { /* leave the desktop layout; app.js adds it if it can */ }
</script>
</head>
<body>

<header class="app-topbar">
  <img src="static/icons/wordmark-sorted.png" alt="Sorted" class="topbar-logo" width="106" height="24">
  <!-- Filled by app.js: who's currently using the app. -->
  <div class="topbar-person" id="topbar-person"></div>
</header>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1 class="logo">Sorted</h1>
    <!-- Desktop counterpart of the top bar's person chip: the top bar is
         hidden above 768px, so the rail needs its own. -->
    <div class="sidebar-person" id="sidebar-person"></div>
  </div>
  <ul class="nav-list">
    <li><button type="button" class="nav-item active" data-page="dashboard" aria-label="Dashboard">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      <span>Dashboard</span>
    </button></li>
    <li><button type="button" class="nav-item" data-page="spend" aria-label="Spent">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      <span>Spent</span>
    </button></li>
    <li><button type="button" class="nav-item" data-page="due" aria-label="Bills">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      <span>Bills</span>
    </button></li>
    <li><button type="button" class="nav-item" data-page="savings" aria-label="Savings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2"></path><path d="M2 9v1c0 1.1.9 2 2 2h1"></path><circle cx="13" cy="9" r="2"></circle></svg>
      <span>Savings</span>
    </button></li>
    <li><button type="button" class="nav-item" data-page="reports" aria-label="Reports">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      <span>Reports</span>
    </button></li>
    <li><button type="button" class="nav-item" data-page="settings" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      <span>Settings</span>
    </button></li>
  </ul>
  <div class="sidebar-footer">
    <button class="btn-export" id="export-btn">Export</button>
    <button class="btn-import" id="import-btn">Import</button>
  </div>
</nav>

<!-- Phone layout (Android APK): filled with a copy of the nav list by
     app.js when running natively, where the vertical rail wastes screen. -->
<nav class="bottom-nav" id="bottom-nav" aria-label="Main"></nav>

<main class="content" id="content">
  <!-- Dynamic content loaded here -->
</main>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modal-title">Add Item</h2>
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body">
      <!-- Form loaded here -->
    </div>
  </div>
</div>

<!-- Full-size receipt viewer -->
<div class="viewer" id="viewer" hidden>
  <div class="viewer-bar">
    <span class="viewer-caption" id="viewer-caption"></span>
    <button class="modal-close" id="viewer-close" aria-label="Close">&times;</button>
  </div>
  <img class="viewer-image" id="viewer-image" alt="Receipt">
</div>

<!-- Passcode lock — covers the app when set. Dots are filled in by settings.js. -->
<div class="lock-screen" id="lock-screen" hidden>
  <div class="lock-panel">
    <img src="static/icons/wordmark-sorted.png" alt="Sorted" class="lock-logo" width="106" height="24">
    <p class="lock-prompt">Enter your passcode</p>
    <div class="lock-dots" id="lock-dots"></div>
    <p class="lock-error" id="lock-error" role="alert"></p>
    <div class="keypad" id="keypad">
      <button class="key" type="button" data-key="1">1</button>
      <button class="key" type="button" data-key="2">2</button>
      <button class="key" type="button" data-key="3">3</button>
      <button class="key" type="button" data-key="4">4</button>
      <button class="key" type="button" data-key="5">5</button>
      <button class="key" type="button" data-key="6">6</button>
      <button class="key" type="button" data-key="7">7</button>
      <button class="key" type="button" data-key="8">8</button>
      <button class="key" type="button" data-key="9">9</button>
      <button class="key key-muted" type="button" data-key="back" aria-label="Delete last digit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5H9l-6 7 6 7h11a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"></path><line x1="17" y1="9" x2="13" y2="15"></line><line x1="13" y1="9" x2="17" y2="15"></line></svg>
      </button>
      <button class="key" type="button" data-key="0">0</button>
      <button class="key key-muted" type="button" data-key="clear" aria-label="Clear passcode">Clear</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Deferred so parsing isn't held up. Order still matters — ocr.js and
     pdf-to-image.js call into the helpers above them. Tesseract (63KB) and
     pdf.js (320KB) are not here at all: two thirds of the payload, and
     neither is needed until a receipt is picked, so they're fetched on demand
     by loadScriptOnce() in utils.js. The theme bootstrap above stays inline
     and unpainted-blocking on purpose — it has to run before the first paint. -->
<!-- Capacitor's runtime. It defines window.Capacitor.registerPlugin, which is how
     every native plugin is reached. The Android build injects only
     native-bridge.js, which is NOT this file and does not provide it — and the
     Capacitor CLI does not copy it into webDir. So a vanilla app that does not
     load it has a window.Capacitor that answers isNativePlatform() and then
     throws on every plugin call. Copied from
     node_modules/@capacitor/core/dist/capacitor.js; there is a test that fails
     if the committed copy drifts from the installed one. -->
<script defer src="capacitor.js"></script>
<script defer src="static/js/db.js"></script>
<script defer src="static/js/utils.js"></script>
<script defer src="static/js/settings.js"></script>
<script defer src="static/js/notify.js"></script>
<script defer src="static/js/sync.js"></script>
<script defer src="static/js/ocr.js"></script>
<script defer src="static/js/pdf-to-image.js"></script>
<!-- The PDF writer is separate from the PDF reader: pdf-to-image.js flattens a
     receipt so OCR can read it, pdfwrite.js puts a report or an export out of
     the app. Neither depends on the other, and neither is on the critical path
     — both are deferred and only touched when their own control is tapped. -->
<script defer src="static/js/pdfwrite.js"></script>
<script defer src="static/js/app.js"></script>
</body>
</html>
